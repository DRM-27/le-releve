# À la demande : télécharge les icônes de jeux (512 × 512) pour préparer des vidéos.
# Les icônes ne sont pas versionnées : elles sortent en artefact, gardé 1 jour.
name: Icônes pour les vidéos
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "universe_id séparés par des virgules"
        required: true
permissions:
  contents: read
jobs:
  icones:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/social/icones.py "${{ inputs.ids }}" icones
      - uses: actions/upload-artifact@v4
        with:
          name: icones
          path: icones/
          retention-days: 1
