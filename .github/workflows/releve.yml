name: Relevé horaire et site

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "tools/**", "assets/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7

      - name: Relevé des API publiques de Roblox
        id: collect
        continue-on-error: true
        run: python tools/collect.py

      - name: Faits de la veille (heure de Paris)
        run: python tools/facts.py || echo "Pas encore de journée complète."

      - name: Archiver les relevés dans le dépôt
        run: |
          git config user.name "releve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data facts
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Relevé $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Construire le site (le vérificateur bloque tout chiffre sans source)
        run: python tools/build.py --drafts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Signaler un relevé en échec
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Le relevé horaire a échoué. Voir data/status.json."
          exit 1

  deploy:
    needs: releve
    if: always() && needs.releve.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
