name: Relevé horaire et site

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"   # second créneau : GitHub saute souvent des exécutions planifiées
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/**", "tools/**", "assets/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7 pillow==11.0.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/releve-icons
          key: icons-${{ github.run_id }}
          restore-keys: icons-

      - name: Relevé des API publiques de Roblox
        id: collect
        continue-on-error: true
        run: python tools/collect.py

      - name: Collecte Fortnite (îles, classements par genre ; archivage seul, rien n'est publié)
        timeout-minutes: 12
        run: python tools/fortnite.py || true

      - name: Relevés quotidiens (game passes, annonces officielles, SEC)
        run: python tools/daily.py || true

      - name: Faits de la semaine (si une semaine complète vient de se terminer)
        run: python tools/hebdo.py || true

      - name: Alertes (mouvements forts sur une heure)
        run: python tools/alerts.py || true

      - name: Pages les plus lues (si la mesure d'audience est branchée)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python tools/analytics.py || true

      - name: Faits de la veille (heure de Paris)
        run: python tools/facts.py || echo "Pas encore de journée complète."

      - name: Quotidien des 3 derniers jours (publié seul s'il passe le vérificateur, 12 relevés minimum)
        run: python tools/quotidien.py || true

      - name: Traductions des quotidiens publiés (modèles traduits, sans IA)
        run: python tools/traduire_quotidiens.py || true

      - name: Archiver les relevés dans le dépôt
        run: |
          git config user.name "releve-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data facts drafts content/articles content/i18n
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Relevé $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

      - name: Prévenir par un ticket GitHub (e-mail) si la collecte échoue 3 fois de suite
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILS=$(python -c "import json;print(json.load(open('data/status.json')).get('echecsConsecutifs',0))" 2>/dev/null || echo 0)
          OPEN=$(gh issue list --label collecte-en-panne --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$FAILS" -ge 3 ] && [ -z "$OPEN" ]; then
            gh label create collecte-en-panne --color B60205 --description "Alerte automatique du relevé horaire" 2>/dev/null || true
            gh issue create --label collecte-en-panne \
              --title "Collecte Roblox en panne ($FAILS échecs de suite)" \
              --body "Le relevé horaire échoue depuis $FAILS passages. Dernier succès : $(python -c "import json;print(json.load(open('data/status.json')).get('dernierSucces'))"). Détail dans data/status.json et dans l'onglet Actions. Ce ticket se ferme tout seul quand la collecte repart." || true
          elif [ "$FAILS" -eq 0 ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "La collecte est repartie ($(date -u +%Y-%m-%dT%H:%MZ))." || true
          fi

      - name: Prévenir par un ticket GitHub (e-mail) si aucun quotidien depuis 2 jours
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOURS=$(python - <<'PY'
          import glob, datetime as dt
          f = sorted(glob.glob("content/articles/*-quotidien.md"))
          d = dt.date.fromisoformat(f[-1].split("/")[-1][:10]) if f else dt.date(2000, 1, 1)
          print((dt.date.today() - d).days)
          PY
          )
          OPEN=$(gh issue list --label quotidien-en-panne --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$JOURS" -ge 3 ] && [ -z "$OPEN" ]; then
            gh label create quotidien-en-panne --color D93F0B --description "Alerte automatique : pas de quotidien publié" 2>/dev/null || true
            gh issue create --label quotidien-en-panne --title "Aucun quotidien publié depuis $JOURS jours" \
              --body "Le dernier quotidien publié date de $JOURS jours. Causes possibles : journée sous 12 relevés, vérificateur en échec (voir l'étape « Quotidien » dans l'onglet Actions). Ce ticket se ferme tout seul au prochain quotidien publié." || true
          elif [ "$JOURS" -le 2 ] && [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "Un quotidien est de nouveau publié." || true
          fi

      - name: Hébergement (Cloudflare Pages dès que les secrets existent, sinon GitHub Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            # config.json modifié dans l'exécution seulement (jamais commité) : le site est construit pour le domaine
            python - <<'PY'
          import json
          c = json.load(open("config.json"))
          c["baseUrl"] = c["domaine"]; c["hebergeur"] = "cloudflare"
          json.dump(c, open("config.json", "w"), ensure_ascii=False, indent=2)
          PY
            echo "HEBERGEMENT=cloudflare" >> "$GITHUB_ENV"
          else
            echo "HEBERGEMENT=github" >> "$GITHUB_ENV"
          fi

      - name: Rapport mensuel « État de Roblox » (PDF du mois écoulé, dès le 1er du mois)
        run: |
          MOIS=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          python tools/rapport.py --mois "$MOIS" --out out/rapport || echo "Pas de rapport pour $MOIS."

      - name: Construire le site (le vérificateur bloque tout chiffre sans source)
        run: python tools/build.py --drafts

      - name: Contrôle qualité (liens, images, titres)
        run: python tools/qa.py || true

      - name: Publier sur Cloudflare Pages (projet playledgers, domaine playledgers.com)
        if: env.HEBERGEMENT == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '/le-releve/* /:splat 301\n' > _site/_redirects
          npx --yes wrangler@4 pages project create playledgers --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy _site --project-name=playledgers --branch=main --commit-dirty=true
          # Domaine et DNS : idempotent, les erreurs « existe déjà » sont ignorées
          API=https://api.cloudflare.com/client/v4; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for d in playledgers.com www.playledgers.com; do
            curl -s -X POST "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/playledgers/domains" -H "$H" \
              -H "Content-Type: application/json" --data "{\"name\":\"$d\"}" | python -c "import sys,json; r=json.load(sys.stdin); print('domaine', '$d', r.get('success'), [e.get('message') for e in r.get('errors', [])])" || true
          done
          ZONE=$(curl -s "$API/zones?name=playledgers.com" -H "$H" | python -c "import sys,json; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
          if [ -n "$ZONE" ]; then
            for n in playledgers.com www; do
              EXIST=$(curl -s "$API/zones/$ZONE/dns_records?name=$( [ $n = www ] && echo www.playledgers.com || echo playledgers.com )" -H "$H" | python -c "import sys,json; print(len([r for r in (json.load(sys.stdin).get('result') or []) if r.get('type') in ('A','AAAA','CNAME')]))")
              if [ "$EXIST" = "0" ]; then
                curl -s -X POST "$API/zones/$ZONE/dns_records" -H "$H" -H "Content-Type: application/json" \
                  --data "{\"type\":\"CNAME\",\"name\":\"$n\",\"content\":\"playledgers.pages.dev\",\"proxied\":true}" | python -c "import sys,json; r=json.load(sys.stdin); print('dns', r.get('success'), [e.get('message') for e in r.get('errors', [])])" || true
              fi
            done
          else
            echo "::warning::Zone playledgers.com introuvable avec ce jeton (permission Zone › Zone › Read manquante ?). DNS à vérifier à la main."
          fi

      - name: Préparer GitHub Pages (le site, ou des redirections vers playledgers.com)
        run: |
          if [ "$HEBERGEMENT" = "cloudflare" ]; then
            DOM=$(python -c "import json; print(json.load(open('config.json'))['domaine'])")
            # Tant que le domaine ne répond pas (DNS ou certificat en cours), on renvoie vers l'adresse Cloudflare qui marche déjà
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$DOM/robots.txt" || echo 000)
            if [ "$CODE" != "200" ]; then echo "::warning::$DOM répond $CODE : redirections vers playledgers.pages.dev en attendant."; DOM=https://playledgers.pages.dev; fi
            python tools/redirections.py _site _gh "$DOM"
            echo "PAGES_DIR=_gh" >> "$GITHUB_ENV"
          else
            echo "PAGES_DIR=_site" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Signaler un relevé en échec
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Le relevé horaire a échoué. Voir data/status.json."
          exit 1

  deploy:
    needs: releve
    if: always() && needs.releve.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
