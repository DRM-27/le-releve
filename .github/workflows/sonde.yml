name: Sonde des sources (temporaire)
on:
  push:
    branches: [sonde-sources]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install duckdb==1.1.3 pandas
      - run: python sonde/sonde.py
